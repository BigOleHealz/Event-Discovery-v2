repos:
  # Python — linting + formatting (replaces black, isort, flake8)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
        files: ^apps/api/
      - id: ruff-format
        files: ^apps/api/

  # General — trailing whitespace, EOF newlines, etc.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key

  # TypeScript/JS — ESLint (runs via local install)
  - repo: local
    hooks:
      - id: eslint
        name: ESLint
        entry: pnpm --filter web lint
        language: system
        files: ^apps/web/src/
        types: [file]
        pass_filenames: false

      - id: prettier
        name: Prettier
        entry: pnpm exec prettier --write
        language: system
        files: \.(ts|tsx|js|jsx|json|css|md)$
        exclude: ^apps/web/.next/
